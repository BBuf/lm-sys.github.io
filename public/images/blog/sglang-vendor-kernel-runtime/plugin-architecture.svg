<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="960" viewBox="0 0 1120 960" role="img" aria-labelledby="title desc">
<title id="title">External libraries and SGLang integration</title>
<desc id="desc">AMD Mono and NVIDIA Mega register specifications. SGLang validates configuration, builds the implementation and connects resources, then dispatches supported steps to the plugin or other steps to native execution. Function names reflect the separate AMD and NVIDIA interfaces.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#718198"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#24334b}.title{font-size:30px;font-weight:700}.head{font-size:27px;font-weight:700}.body{font-size:23px}.code{font-family:Menlo,Consolas,monospace;font-size:20px}.note{font-size:21px;fill:#52637b}.arrow{fill:none;stroke:#718198;stroke-width:2.5;marker-end:url(#arrow)}</style>
