<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">Plugin integration in SGLang</title>
<desc id="desc">AMD and NVIDIA plugins register with SGLang. The integration proceeds through guard, build and bind, and dispatch. Covered steps use the plugin forward; other steps use the native forward.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#7b8ba1"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#24334a;text-anchor:middle;font-size:28px;font-weight:600}.arrow{fill:none;stroke:#7b8ba1;stroke-width:2.5;marker-end:url(#arrow)}.label{font-size:22px;font-weight:400;fill:#52647d}</style>
<rect width="1000" height="700" rx="18" fill="#fafbfd"/>
<rect x="340" y="28" width="628" height="650" rx="18" fill="#f0f4f9"/>
<text x="654" y="76" font-size="32">SGLang</text>
<rect x="30" y="117" width="240" height="76" rx="12" fill="#e9e5fa"/>
<text x="150" y="165">AMD Plugin</text>
<rect x="30" y="233" width="240" height="76" rx="12" fill="#e9e5fa"/>
<text x="150" y="281">NVIDIA Plugin</text>
<path d="M270 155 H306 V165 H510" class="arrow"/>
<path d="M270 271 H306 V165" fill="none" stroke="#7b8ba1" stroke-width="2.5"/>
<rect x="510" y="127" width="288" height="76" rx="12" fill="white" stroke="#c8d3e3"/>
<text x="654" y="175">Register</text>
<path d="M654 203 V237" class="arrow"/>
<rect x="510" y="237" width="288" height="76" rx="12" fill="white" stroke="#c8d3e3"/>
<text x="654" y="285">Guard</text>
<path d="M654 313 V347" class="arrow"/>
<rect x="510" y="347" width="288" height="76" rx="12" fill="white" stroke="#c8d3e3"/>
<text x="654" y="395">Build &amp; Bind</text>
<path d="M654 423 V457" class="arrow"/>
<rect x="510" y="457" width="288" height="76" rx="12" fill="white" stroke="#c8d3e3"/>
<text x="654" y="505">Dispatch</text>
<path d="M580 533 V557 H510 V580" class="arrow"/>
<path d="M728 533 V557 H806 V580" class="arrow"/>
<rect x="367" y="580" width="286" height="76" rx="12" fill="#dcefe6"/>
<text x="510" y="628">Plugin Forward</text>
<rect x="674" y="580" width="270" height="76" rx="12" fill="#e3e9f2"/>
<text x="809" y="628">Native Forward</text>
</svg>