<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
<title id="title">External kernel plugins and the SGLang runtime</title>
<desc id="desc">External AMD and NVIDIA packages provide specifications and specialized execution. SGLang registers and validates specifications, builds the plugin using model weights, and supplies runtime state through integration interfaces. A dispatcher routes covered steps to the built plugin or other steps to native execution. Weight preparation happens at startup; runtime state is accessed when available. The two backends have distinct interfaces.</desc>
