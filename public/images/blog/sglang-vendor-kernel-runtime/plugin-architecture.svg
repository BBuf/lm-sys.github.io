<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
<title id="title">Plugin integration in SGLang</title>
<desc id="desc">AMD Mono and NVIDIA Mega supply model specifications, weight preparation and kernels. SGLang registers specifications, checks configuration, binds resources and installs model-forward dispatch. Covered steps use plugin execution; other steps use native execution.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#77859a"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#26354b;font-size:25px}.heading{font-size:28px;font-weight:700}.detail{font-size:23px;fill:#53627a}.arrow{fill:none;stroke:#77859a;stroke-width:2.3;marker-end:url(#arrow)}</style>
<rect width="1000" height="690" fill="white"/>
<rect x="16" y="16" width="280" height="658" rx="8" fill="#f2eff9" stroke="#d9d2e8"/>
<rect x="326" y="16" width="658" height="658" rx="8" fill="#f1f5f9" stroke="#d5dfe9"/>
<text x="38" y="65" class="heading">External Libraries</text>
<text x="350" y="65" class="heading">SGLang</text>
<rect x="32" y="112" width="120" height="68" rx="5" fill="white" stroke="#d9d2e8"/>
<rect x="164" y="112" width="120" height="68" rx="5" fill="white" stroke="#d9d2e8"/>
<text x="92" y="140" text-anchor="middle" style="font-size:21px;font-weight:700">AMD</text>
<text x="92" y="165" text-anchor="middle" style="font-size:21px;font-weight:700">Mono</text>
<text x="224" y="140" text-anchor="middle" style="font-size:21px;font-weight:700">NVIDIA</text>
<text x="224" y="165" text-anchor="middle" style="font-size:21px;font-weight:700">Mega</text>
<path d="M92 180 V205 H224 V180 M158 205 V232" fill="none" stroke="#77859a" stroke-width="2.3"/>
<rect x="32" y="232" width="252" height="340" rx="7" fill="#e8e2f3" stroke="#d9d2e8"/>
<text x="158" y="266" text-anchor="middle" style="font-size:18px;fill:#53627a">Each library provides</text>
<rect x="48" y="290" width="220" height="66" rx="5" fill="white" stroke="#d9d2e8"/>
<text x="158" y="331" text-anchor="middle" style="font-size:23px">Model Spec</text>
<rect x="48" y="382" width="220" height="66" rx="5" fill="white" stroke="#d9d2e8"/>
<text x="158" y="423" text-anchor="middle" style="font-size:22px">Weight Preparation</text>
<rect x="48" y="474" width="220" height="66" rx="5" fill="white" stroke="#d9d2e8"/>
<text x="158" y="515" text-anchor="middle" style="font-size:22px">Specialized Kernels</text>
<path d="M268 323 H310 V151 H350" class="arrow"/>
<rect x="350" y="112" width="610" height="78" rx="6" fill="white" stroke="#cbd7e4"/>
<text x="372" y="160" style="font-size:19px"><tspan font-weight="700">Register:</tspan> Register model-specific kernels from external libraries.</text>
<path d="M655 190 V228" class="arrow"/>
<rect x="350" y="228" width="610" height="78" rx="6" fill="white" stroke="#cbd7e4"/>
<text x="372" y="276"><tspan font-weight="700">Guard:</tspan> Validate hardware/configuration compatibility.</text>
<path d="M655 306 V344" class="arrow"/>
<rect x="350" y="344" width="610" height="112" rx="6" fill="white" stroke="#cbd7e4"/>
<text x="372" y="387"><tspan font-weight="700">Build:</tspan> Install forward dispatch and bind weights.</text>
<path d="M655 456 V494" class="arrow"/>
<rect x="350" y="494" width="610" height="78" rx="6" fill="white" stroke="#cbd7e4"/>
<text x="372" y="542" style="font-size:16px"><tspan font-weight="700">Runtime:</tspan> Coordinate plugin and native execution in SGLang’s ModelRunner.</text>
<path d="M655 572 V590 H500 V608" class="arrow"/>
<path d="M655 590 H810 V608" class="arrow"/>
<rect x="344" y="608" width="312" height="48" rx="5" fill="#e3f0e9" stroke="#bfd7ca"/>
<rect x="668" y="608" width="306" height="48" rx="5" fill="#e5ebf3" stroke="#cbd7e4"/>
<text x="500" y="638" text-anchor="middle" style="font-size:19px"><tspan font-weight="700">Plugin:</tspan> Specialized Forward</text>
<text x="821" y="638" text-anchor="middle" style="font-size:18px"><tspan font-weight="700">Native:</tspan> SGLang General Forward</text>
</svg>